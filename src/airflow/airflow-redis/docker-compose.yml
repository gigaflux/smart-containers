
x-config:
  image: &image "ghcr.io/gigaflux/airflow-redis:7.2"

services:
  airflow-redis-1:
    image: *image
    container_name: airflow-redis-1
    hostname: airflow-redis-1
    volumes:
      - ../../../var/.vault/users/redis:/tmp/redis:ro
      - ./redis.conf:/tmp/redis.conf:ro
      - airflow-redis-1_data:/data
    user: root
    entrypoint: [ ]
    command: >
      sh -c '
        set -e
        mkdir -p /usr/local/etc/redis
        cp -r /tmp/redis/. /usr/local/etc/redis/
        cp -f /tmp/redis.conf /usr/local/etc/redis
        chmod 400 /usr/local/etc/redis/redis.key
        chmod 400 /usr/local/etc/redis/redis.pwd
        chown -R redis:redis /usr/local/etc/redis
        REDIS_PWD=$$(cat /usr/local/etc/redis/redis.pwd)
        export REDISCLI_AUTH=$$REDIS_PWD
        exec /usr/local/bin/docker-entrypoint.sh redis-server /usr/local/etc/redis/redis.conf
      '
    networks:
      - airflow-net
    healthcheck:
      test: >
        sh -c '
          set -e
          REDIS_PWD=$$(cat /usr/local/etc/redis/redis.pwd) &&
          export REDISCLI_AUTH=$$REDIS_PWD &&
          redis-cli ping
        '
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

